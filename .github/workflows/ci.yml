name: TAGBOUND build and browser smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tagbound-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3

      - name: Generate PWA icons
        run: python3 scripts/generate_icons.py

      - name: Configure WebAssembly build
        run: emcmake cmake -S . -B build-web -G Ninja -DPLATFORM=Web -DCMAKE_BUILD_TYPE=Release

      - name: Compile WebAssembly
        run: cmake --build build-web --config Release --parallel 2

      - name: Run gameplay regression tests
        run: |
          em++ -std=c++17 -O2 -Isrc -Ibuild-web/_deps/raylib-src/src \
            src/game.cpp src/systems.cpp tests/gameplay.cpp \
            -sENVIRONMENT=node -sEXIT_RUNTIME=1 -o /tmp/tagbound-gameplay-tests.js
          node /tmp/tagbound-gameplay-tests.js

      - name: Assemble static PWA
        run: cp -R web/. dist/

      - name: Validate generated output
        run: |
          test -s dist/game.js
          test -s dist/game.wasm
          test -s dist/index.html
          test -s dist/sw.js
          node --check dist/pwa.js
          node --check dist/game.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('dist')
          json.loads((root / 'manifest.json').read_text())
          sw = (root / 'sw.js').read_text()
          assert "const VERSION='tagbound-v27';" in sw, 'Service-worker cache version was not bumped.'
          for asset in ('/', '/styles.css', '/pwa.js', '/manifest.json',
                        '/icons/icon-192.png', '/icons/icon-512.png',
                        '/game.js', '/game.wasm'):
              path = root / ('index.html' if asset == '/' else asset.lstrip('/'))
              assert path.exists() and path.is_file(), f'Missing cached asset: {asset}'
              assert f"'{asset}'" in sw or f'"{asset}"' in sw, f'Not in service-worker core list: {asset}'
          print('Static PWA assets and service-worker precache list are valid.')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: tagbound-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  browser-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tagbound-dist
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium
        run: |
          npm install --no-save playwright pngjs
          npx playwright install --with-deps chromium

      - name: Serve and test browser runtime and offline cache
        run: |
          mkdir -p visual-review
          python3 -m http.server 4173 --directory dist > /tmp/tagbound-http.log 2>&1 &
          echo $! > /tmp/tagbound-http.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { PNG } from 'pngjs';

          const browser = await chromium.launch({
            headless: true,
            args: ['--use-gl=angle', '--use-angle=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist']
          });
          const context = await browser.newContext();
          const page = await context.newPage();
          const errors = [];
          page.on('pageerror', error => errors.push(error.message));
          page.on('console', message => {
            if (message.type() === 'error') errors.push(message.text());
          });

          try {
            const response = await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            if (!response?.ok()) throw new Error('The game page did not return HTTP 200.');
            await page.waitForFunction(() => {
              const loading = document.querySelector('#loading');
              return loading && loading.classList.contains('hidden');
            }, { timeout: 45000 });
            await page.screenshot({ path: 'visual-review/desktop-intro.png', fullPage: true });

            const iconOnlyUi = await page.evaluate(() => {
              const actionButtons = [...document.querySelectorAll('#touch-controls .action')];
              const iconOnly = button => !!button && !!button.querySelector('svg[aria-hidden="true"]') &&
                !!button.getAttribute('aria-label') && !button.textContent.trim();
              const pauseActions = ['#settings-sound', '#settings-install', '#resume']
                .map(selector => document.querySelector(selector));
              return {
                touchHelpRemoved: !document.querySelector('#touch-help'),
                actionButtonsIconOnly: actionButtons.length === 7 && actionButtons.every(iconOnly),
                pauseButtonIconOnly: iconOnly(document.querySelector('#settings-open')),
                pauseActionsIconOnly: pauseActions.every(iconOnly),
                pauseTitleAccessible: document.querySelector('#settings-title')?.classList.contains('sr-only')
              };
            });
            if (!iconOnlyUi.touchHelpRemoved || !iconOnlyUi.actionButtonsIconOnly ||
                !iconOnlyUi.pauseButtonIconOnly || !iconOnlyUi.pauseActionsIconOnly ||
                !iconOnlyUi.pauseTitleAccessible) {
              throw new Error('Icon-only game controls are incomplete: ' + JSON.stringify(iconOnlyUi));
            }

            const runtime = await page.evaluate(() => ({
              canvas: !!document.querySelector('#canvas'),
              wasm: typeof WebAssembly === 'object',
              webgl: !!(document.querySelector('#canvas').getContext('webgl2') || document.querySelector('#canvas').getContext('webgl')),
              introVisible: !document.querySelector('#intro').classList.contains('hidden'),
              installVisible: (() => { const b=document.querySelector('#install'); const r=b?.getBoundingClientRect(); return !!b && !b.hidden && r.width>0 && r.height>0; })(),
              soundToggleVisible: (() => { const b=document.querySelector('#sound-toggle'); const r=b?.getBoundingClientRect(); return !!b && r.width>0 && r.height>0; })(),
              settingsInstallHidden: document.querySelector('#settings-install').getClientRects().length === 0,
              settingsButtonHidden: document.querySelector('#settings-open').getClientRects().length === 0,
              floatingInstallPresent: !!document.querySelector('#install-float'),
              settingsInstallScoped: document.querySelector('#settings').contains(document.querySelector('#settings-install')),
              settingsInstallHiddenAtHome: document.querySelector('#settings-install').getClientRects().length === 0,
              settingsButtonHiddenAtHome: document.querySelector('#settings-open').getClientRects().length === 0
            }));
            const homeMusicState = await page.evaluate(() => ({
              state: window.TagboundAudio?.getMusicState?.(),
              notes: window.TagboundAudio?.getMusicNoteCount?.()
            }));
            if (homeMusicState.state !== 'stopped' || homeMusicState.notes !== 0) {
              throw new Error('Ambient score must remain silent on Home: ' + JSON.stringify(homeMusicState));
            }
            const classStats = await page.locator('.class-card').allTextContents();
            if (!classStats[0].includes('125 HP') || !classStats[0].includes('95 STA') ||
                !classStats[0].includes('Heavy Strike') ||
                !classStats[1].includes('95 HP') || !classStats[1].includes('100 STA') ||
                !classStats[2].includes('115 HP') || !classStats[2].includes('100 STA') ||
                !classStats[2].includes('Efficient Guard')) {
              throw new Error('Class selection stats do not match gameplay limits: ' + JSON.stringify(classStats));
            }

            if (!runtime.canvas || !runtime.wasm || !runtime.webgl || !runtime.introVisible ||
                !runtime.installVisible || !runtime.soundToggleVisible || runtime.floatingInstallPresent ||
                !runtime.settingsInstallScoped || !runtime.settingsInstallHiddenAtHome || !runtime.settingsButtonHiddenAtHome) {
              throw new Error('Runtime smoke test failed: ' + JSON.stringify(runtime));
            }

            // Verify each class has one fixed weapon and only Skirmisher has the BOW touch action.
            const classLoadouts = [
              { klass: 0, weapon: 0, bowVisible: false },
              { klass: 1, weapon: 3, bowVisible: true },
              { klass: 2, weapon: 2, bowVisible: false }
            ];
            for (const loadout of classLoadouts) {
              const loadoutContext = await browser.newContext();
              const loadoutPage = await loadoutContext.newPage();
              const loadoutResponse = await loadoutPage.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle', timeout: 60000 });
              if (!loadoutResponse?.ok()) throw new Error('CI class loadout page did not return HTTP 200.');
              await loadoutPage.waitForFunction(
                () => document.querySelector('#loading')?.classList.contains('hidden') &&
                  typeof window.TagboundSettings?.isOpen === 'function',
                null,
                { timeout: 45000 }
              );
              await loadoutPage.locator('[data-class="' + loadout.klass + '"]').click();
              const bowVisible = await loadoutPage.locator('#touch-controls [data-bit="16"]')
                .evaluate(element => !element.hidden);
              if (bowVisible !== loadout.bowVisible) {
                throw new Error('CI class BOW control visibility mismatch: ' + JSON.stringify({ loadout, bowVisible }));
              }
              await loadoutPage.locator('#start').click();
              await loadoutPage.waitForFunction(() => document.querySelector('#intro')?.classList.contains('hidden'));
              const savedLoadout = await loadoutPage.evaluate(() => JSON.parse(localStorage.getItem('tagbound-save') || 'null'));
              if (savedLoadout?.klass !== loadout.klass || savedLoadout?.weapon !== loadout.weapon) {
                throw new Error('CI fixed class weapon mapping failed: ' + JSON.stringify({ loadout, savedLoadout }));
              }
              await loadoutContext.close();
            }

            // A saved City 0 / Quest 2 run restores the held-beacon objective state.
            const holdContext = await browser.newContext();
            const holdPage = await holdContext.newPage();
            const holdResponse = await holdPage.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            if (!holdResponse?.ok()) throw new Error('Held-beacon test page did not return HTTP 200.');
            await holdPage.evaluate(() => localStorage.setItem('tagbound-save', JSON.stringify({
              city: 0, level: 1, xp: 0, unlocked: 0, klass: 0, weapon: 0, finished: 0, quest: 1
            })));
            await holdPage.reload({ waitUntil: 'networkidle' });
            await holdPage.waitForFunction(
              () => document.querySelector('#loading')?.classList.contains('hidden'),
              null,
              { timeout: 45000 }
            );
            await holdPage.locator('#start').click();
            await holdPage.waitForFunction(() => document.querySelector('#intro')?.classList.contains('hidden'));
            const heldObjectiveState = await holdPage.evaluate(() => ({
              quest: Module.ccall('GetQuestProgress', 'number', [], []),
              requiresHold: Module.ccall('IsCurrentQuestHoldObjective', 'number', [], []),
              progress: Module.ccall('GetBeaconHoldProgress', 'number', [], []),
              duration: Module.ccall('GetCurrentQuestHoldDuration', 'number', [], [])
            }));
            if (heldObjectiveState.quest !== 1 || heldObjectiveState.requiresHold !== 1 ||
                Math.abs(heldObjectiveState.progress) > 0.001 || heldObjectiveState.duration < 2.5) {
              throw new Error('Held-beacon checkpoint did not restore correctly: ' + JSON.stringify(heldObjectiveState));
            }
            await holdContext.close();

            await page.locator('#sound-toggle').click();
            const muted = await page.evaluate(() => ({
              label: document.querySelector('#sound-toggle').textContent,
              saved: localStorage.getItem('tagbound-sound')
            }));
            if (muted.label !== 'SOUND: OFF' || muted.saved !== 'off') {
              throw new Error('Home sound mute setting did not persist: ' + JSON.stringify(muted));
            }
            await page.locator('#sound-toggle').click();
            const unmuted = await page.evaluate(() => ({
              label: document.querySelector('#sound-toggle').textContent,
              saved: localStorage.getItem('tagbound-sound')
            }));
            if (unmuted.label !== 'SOUND: ON' || unmuted.saved !== 'on') {
              throw new Error('Home sound restore setting did not persist: ' + JSON.stringify(unmuted));
            }

            await page.locator('[data-class="1"]').click();
            await page.locator('#start').click();
            await page.waitForFunction(() => document.querySelector('#intro')?.classList.contains('hidden'));
            await page.waitForFunction(() => window.TagboundAudio?.getState?.() === 'running', null, { timeout: 5000 });
            await page.waitForFunction(() => window.TagboundAudio?.getMusicState?.() === 'playing', null, { timeout: 5000 });
            await page.waitForFunction(() => window.TagboundAudio?.getMusicNoteCount?.() > 0, null, { timeout: 5000 });
            const audioPlayed = await page.evaluate(() => window.TagboundAudio.play(0));
            if (!audioPlayed) throw new Error('Synthesized combat audio did not start after the Home-screen click.');
            await page.keyboard.down('w');
            await page.waitForTimeout(250);
            await page.keyboard.up('w');
            await page.keyboard.press('Shift');
            await page.keyboard.press('1');
            await page.keyboard.press('2');
            await page.waitForTimeout(300);
            const gameplay = await page.evaluate(() => ({
              introHidden: document.querySelector('#intro').classList.contains('hidden'),
              canvasSize: { width: document.querySelector('#canvas').width, height: document.querySelector('#canvas').height },
              save: JSON.parse(localStorage.getItem('tagbound-save') || 'null'),
              installHiddenDuringGameplay: document.querySelector('#install')?.getClientRects().length === 0,
              settingsInstallHiddenDuringGameplay: document.querySelector('#settings-install')?.getClientRects().length === 0,
              settingsButtonVisible: document.querySelector('#settings-open')?.getClientRects().length > 0,
              settingsButtonClearOfHud: (() => {
                const s = document.querySelector('#settings-open').getBoundingClientRect();
                const h = innerHeight <= 440 ? 96 : innerHeight - 78;
                const boxes = [
                  { left: 12, right: 262, top: 12, bottom: 87 },
                  { left: innerWidth - 245, right: innerWidth - 12, top: 12, bottom: 88 },
                  { left: innerWidth / 2 - 56, right: innerWidth / 2 + 56, top: 12, bottom: 64 },
                  { left: innerWidth / 2 - 96, right: innerWidth / 2 + 96, top: 67, bottom: 90 },
                  { left: 12, right: 402, top: h, bottom: h + 65 }
                ];
                return boxes.every(b => !(s.left < b.right && s.right > b.left && s.top < b.bottom && s.bottom > b.top));
              })()
            }));
            if (!gameplay.introHidden || !gameplay.canvasSize.width || !gameplay.canvasSize.height ||
                !gameplay.save || gameplay.save.klass !== 1 || gameplay.save.city !== 0 || gameplay.save.quest !== 0 ||
                !gameplay.installHiddenDuringGameplay || !gameplay.settingsInstallHiddenDuringGameplay ||
                !gameplay.settingsButtonVisible || !gameplay.settingsButtonClearOfHud) {
              throw new Error('Gameplay start/class-selection/save smoke test failed: ' + JSON.stringify(gameplay));
            }

            // Settings must expose install only while open and pause the actual C++ simulation.
            await page.evaluate(() => {
              Module.ccall('SetTouch', null, ['number', 'number', 'number'], [0.65, -0.35, 4]);
              Module.ccall('SetLook', null, ['number', 'number'], [7.5, -2.5]);
              const action = document.querySelector('.action');
              action.classList.add('active');
              action.dataset.pointerId = '999';
            });
            await page.locator('#settings-open').click();
            const inputReset = await page.evaluate(() => ({
              clear: Module.ccall('IsInputStateClear', 'number', [], []),
              activeButtons: document.querySelectorAll('.action.active').length,
              pointerIds: document.querySelectorAll('.action[data-pointer-id]').length,
              musicState: window.TagboundAudio?.getMusicState?.(),
              musicNotes: window.TagboundAudio?.getMusicNoteCount?.()
            }));
            if (inputReset.clear !== 1 || inputReset.activeButtons || inputReset.pointerIds) {
              throw new Error('Touch/look input was not fully reset when Settings opened: ' + JSON.stringify(inputReset));
            }
            if (inputReset.musicState !== 'paused') {
              throw new Error('CI ambient score did not pause with Settings: ' + inputReset.musicState);
            }
            const settingsVisible = await page.evaluate(() => ({
              open: !document.querySelector('#settings').classList.contains('hidden'),
              installVisible: document.querySelector('#settings-install').getClientRects().length > 0,
              homeInstallHidden: document.querySelector('#install').getClientRects().length === 0,
              touchControlsHidden: document.querySelector('#touch-controls').classList.contains('hidden')
            }));
            if (!settingsVisible.open || !settingsVisible.installVisible || !settingsVisible.homeInstallHidden) {
              throw new Error('Settings screen or install placement failed: ' + JSON.stringify(settingsVisible));
            }
            await page.locator('#settings-sound').click();
            if (await page.locator('#sound-toggle').textContent() !== 'SOUND: OFF' ||
                await page.locator('#settings-sound').getAttribute('aria-label') !== 'Enable sound' ||
                await page.locator('#settings-sound').getAttribute('aria-pressed') !== 'false' ||
                await page.evaluate(() => localStorage.getItem('tagbound-sound')) !== 'off') {
              throw new Error('Settings sound toggle did not synchronize with Home.');
            }
            await page.locator('#settings-sound').click();
            if (await page.evaluate(() => window.TagboundAudio?.getMusicState?.()) !== 'paused') {
              throw new Error('Ambient score resumed while Settings was still open.');
            }
            const pausedMusicNotes = await page.evaluate(() => window.TagboundAudio?.getMusicNoteCount?.());
            await page.waitForTimeout(550);
            const musicNotesWhilePaused = await page.evaluate(() => window.TagboundAudio?.getMusicNoteCount?.());
            if (musicNotesWhilePaused !== pausedMusicNotes) throw new Error('Ambient score kept generating notes while paused.');
            const pausedState = await page.evaluate(() => Module.ccall('IsGameUpdating', 'number', [], []));
            if (pausedState !== 0) throw new Error('C++ simulation was not paused while Settings was open.');
            await page.locator('#resume').click();
            const resumedState = await page.evaluate(() => Module.ccall('IsGameUpdating', 'number', [], []));
            if (resumedState !== 1) throw new Error('C++ simulation did not resume after closing Settings.');
            await page.waitForFunction(
              (previousCount) => window.TagboundAudio?.getMusicState?.() === 'playing' &&
                window.TagboundAudio?.getMusicNoteCount?.() > previousCount,
              pausedMusicNotes,
              { timeout: 5000 }
            );

            // Reopen from a saved boss-gate state and confirm C++ restored the boss.
            await page.evaluate(() => {
              const save = JSON.parse(localStorage.getItem('tagbound-save') || '{}');
              save.quest = 3;
              localStorage.setItem('tagbound-save', JSON.stringify(save));
            });
            await page.reload({ waitUntil: 'networkidle' });
            await page.waitForFunction(() => document.querySelector('#loading')?.classList.contains('hidden'), { timeout: 45000 });
            await page.locator('#start').click();
            await page.waitForFunction(() => document.querySelector('#intro')?.classList.contains('hidden'));
            const restored = await page.evaluate(() => ({
              quest: Module.ccall('GetQuestProgress', 'number', [], []),
              bosses: Module.ccall('GetActiveBossCount', 'number', [], []),
              save: JSON.parse(localStorage.getItem('tagbound-save') || 'null')
            }));
            if (restored.quest !== 3 || restored.bosses !== 1 || restored.save?.quest !== 3) {
              throw new Error('Saved boss-gate restoration failed: ' + JSON.stringify(restored));
            }
            await page.waitForTimeout(2000);
            const gameplayImage = await page.screenshot({ path: 'visual-review/desktop-gameplay.png', fullPage: true });
            const gameplayPng = PNG.sync.read(gameplayImage);
            let healthTextPixels = 0;
            for (let y = 14; y < 38; y++) {
              for (let x = 20; x < Math.min(190, gameplayPng.width); x++) {
                const pixel = (y * gameplayPng.width + x) * 4;
                if (gameplayPng.data[pixel] > 170 &&
                    gameplayPng.data[pixel + 1] > 170 &&
                    gameplayPng.data[pixel + 2] > 170) healthTextPixels++;
              }
            }
            if (healthTextPixels < 12) {
              throw new Error('The in-game health HUD is not visibly rendered in the gameplay frame.');
            }
            const staminaRegion = PNG.sync.read(gameplayImage);
            let staminaDigitPixels = 0;
            let staminaOverlapGreenPixels = 0;
            for (let y = 56; y < 70; y++) {
              for (let x = 108; x < 127; x++) {
                const pixel = (y * staminaRegion.width + x) * 4;
                const red = staminaRegion.data[pixel];
                const green = staminaRegion.data[pixel + 1];
                const blue = staminaRegion.data[pixel + 2];
                if (red > 170 && green > 170 && blue > 170) staminaDigitPixels++;
                if (y >= 60 && y < 67 && green > 100 && green > red + 30 && green > blue + 30) staminaOverlapGreenPixels++;
              }
            }
            if (staminaDigitPixels < 5 || staminaOverlapGreenPixels !== 0) {
              throw new Error('Desktop stamina value is clipped/covered by its bar: ' +
                JSON.stringify({ staminaDigitPixels, staminaOverlapGreenPixels }));
            }
            await page.evaluate(() => {
              const save = JSON.parse(localStorage.getItem('tagbound-save') || '{}');
              save.finished = 1;
              localStorage.setItem('tagbound-save', JSON.stringify(save));
            });
            await page.reload({ waitUntil: 'networkidle' });
            await page.waitForFunction(() => document.querySelector('#loading')?.classList.contains('hidden'), { timeout: 45000 });
            await page.locator('#start').click();
            await page.waitForFunction(() => !document.querySelector('#ending')?.classList.contains('hidden'));
            const victoryAudio = await page.evaluate(() => ({
              music: window.TagboundAudio?.getMusicState?.(),
              notes: window.TagboundAudio?.getMusicNoteCount?.()
            }));
            if (victoryAudio.music !== 'stopped' || victoryAudio.notes !== 0) {
              throw new Error('A completed save started ambient music behind the victory screen: ' + JSON.stringify(victoryAudio));
            }

            // Seed an old installed-PWA cache, then verify the new worker removes it.
            await page.evaluate(async () => {
              if (!('serviceWorker' in navigator)) throw new Error('Service workers are unavailable.');
              await navigator.serviceWorker.ready;
              await caches.open('tagbound-v23');
              const registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations.map(registration => registration.unregister()));
            });
            await page.reload({ waitUntil: 'networkidle' });
            await page.evaluate(async () => { await navigator.serviceWorker.ready; });
            await page.waitForFunction(() => !!navigator.serviceWorker.controller, { timeout: 30000 });
            const cacheState = await page.evaluate(async () => {
              const keys = await caches.keys();
              const cache = await caches.open('tagbound-v27');
              const expected = ['/', '/styles.css', '/pwa.js', '/manifest.json',
                '/icons/icon-192.png', '/icons/icon-512.png', '/game.js', '/game.wasm'];
              const cached = await Promise.all(expected.map(async path => !!await cache.match(path)));
              return { keys, expected, cached };
            });
            if (!cacheState.keys.includes('tagbound-v27') || cacheState.keys.includes('tagbound-v23') ||
                cacheState.cached.some(value => !value)) {
              throw new Error('Service-worker upgrade or precache failed: ' + JSON.stringify(cacheState));
            }

            await context.setOffline(true);
            await page.reload({ waitUntil: 'networkidle' });
            await page.waitForFunction(() => document.querySelector('#loading')?.classList.contains('hidden'), { timeout: 30000 });
            if (errors.length) throw new Error('Browser console errors: ' + errors.join(' | '));

            const mobileContext = await browser.newContext({
              viewport: { width: 844, height: 390 },
              deviceScaleFactor: 1,
              isMobile: true,
              hasTouch: true
            });
            const mobilePage = await mobileContext.newPage();
            await mobilePage.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await mobilePage.waitForFunction(() => document.querySelector('#loading')?.classList.contains('hidden'), { timeout: 45000 });
            await mobilePage.screenshot({ path: 'visual-review/mobile-intro.png', fullPage: true });
            const mobile = await mobilePage.evaluate(() => ({
              controlsVisible: getComputedStyle(document.querySelector('#touch-controls')).display !== 'none',
              installVisible: (() => { const b=document.querySelector('#install'); const r=b?.getBoundingClientRect(); return !!b && !b.hidden && r.width>0 && r.height>0; })(),
              soundToggleVisible: (() => { const b=document.querySelector('#sound-toggle'); const r=b?.getBoundingClientRect(); return !!b && r.width>0 && r.height>0; })(),
              settingsInstallHidden: document.querySelector('#settings-install').getClientRects().length === 0,
              settingsButtonHidden: document.querySelector('#settings-open').getClientRects().length === 0,
              floatingInstallPresent: !!document.querySelector('#install-float'),
              actionCount: [...document.querySelectorAll('#touch-controls .action')].filter(button => !button.hidden).length,
              bowButtonVisible: !document.querySelector('#touch-controls [data-bit="16"]').hidden,
              weaponButtonPresent: !!document.querySelector('#touch-controls [data-bit="128"]'),
              rotateHidden: document.querySelector('#rotate').classList.contains('hidden'),
              startVisible: (() => { const r=document.querySelector('#start').getBoundingClientRect(); return r.top>=0 && r.bottom<=innerHeight; })(),
              classCardsVisible: [...document.querySelectorAll('.class-card')].every(e => { const r=e.getBoundingClientRect(); return r.top>=0 && r.bottom<=innerHeight; })
            }));
            if (!mobile.controlsVisible || !mobile.installVisible || !mobile.soundToggleVisible ||
                !mobile.settingsInstallHidden || !mobile.settingsButtonHidden || mobile.floatingInstallPresent || mobile.actionCount !== 6 || mobile.bowButtonVisible || mobile.weaponButtonPresent || !mobile.rotateHidden ||
                !mobile.startVisible || !mobile.classCardsVisible) {
              throw new Error('Mobile landscape layout test failed: ' + JSON.stringify(mobile));
            }
            const mobileLoadouts = [
              { klass: 1, weapon: 3, bowVisible: true, actions: 7 },
              { klass: 2, weapon: 2, bowVisible: false, actions: 6 },
              { klass: 0, weapon: 0, bowVisible: false, actions: 6 },
              { klass: 1, weapon: 3, bowVisible: true, actions: 7 }
            ];
            for (const loadout of mobileLoadouts) {
              await mobilePage.locator('[data-class="' + loadout.klass + '"]').tap();
              const state = await mobilePage.evaluate(() => ({
                selected: Number(document.querySelector('.class-card.selected')?.dataset.class),
                bowVisible: !document.querySelector('#touch-controls [data-bit="16"]').hidden,
                actions: [...document.querySelectorAll('#touch-controls .action')].filter(button => !button.hidden).length
              }));
              if (state.selected !== loadout.klass || state.bowVisible !== loadout.bowVisible || state.actions !== loadout.actions) {
                throw new Error('Mobile class control mapping failed: ' + JSON.stringify({ loadout, state }));
              }
            }
            await mobilePage.locator('#start').tap();
            await mobilePage.waitForFunction(() => window.TagboundAudio?.getState?.() === 'running', null, { timeout: 5000 });
            await mobilePage.waitForFunction(() => window.TagboundAudio?.getMusicState?.() === 'playing', null, { timeout: 5000 });
            await mobilePage.waitForFunction(() => window.TagboundAudio?.getMusicNoteCount?.() > 0, null, { timeout: 5000 });
            const mobileSavedLoadout = await mobilePage.evaluate(() => JSON.parse(localStorage.getItem('tagbound-save') || 'null'));
            if (mobileSavedLoadout?.klass !== 1 || mobileSavedLoadout?.weapon !== 3) {
              throw new Error('Mobile Skirmisher save did not retain its Bow loadout: ' + JSON.stringify(mobileSavedLoadout));
            }
            const mobileSettingsButtonClear = await mobilePage.evaluate(() => {
              const s = document.querySelector('#settings-open').getBoundingClientRect();
              const h = innerHeight <= 440 ? 96 : innerHeight - 78;
              const boxes = [
                { left: 12, right: 262, top: 12, bottom: 87 },
                { left: innerWidth - 245, right: innerWidth - 12, top: 12, bottom: 88 },
                { left: innerWidth / 2 - 56, right: innerWidth / 2 + 56, top: 12, bottom: 64 },
                { left: innerWidth / 2 - 96, right: innerWidth / 2 + 96, top: 67, bottom: 90 },
                { left: 12, right: 402, top: h, bottom: h + 65 }
              ];
              return boxes.every(b => !(s.left < b.right && s.right > b.left && s.top < b.bottom && s.bottom > b.top));
            });
            if (!mobileSettingsButtonClear) throw new Error('Mobile Settings button overlaps a HUD panel.');
            const installHiddenDuringGameplay = await mobilePage.locator('#install').evaluate(e => e.getClientRects().length === 0);
            if (!installHiddenDuringGameplay) throw new Error('PWA install action remained visible during mobile gameplay.');
            await mobilePage.evaluate(() => {
              Module.ccall('SetTouch', null, ['number', 'number', 'number'], [-0.4, 0.75, 8]);
              Module.ccall('SetLook', null, ['number', 'number'], [4.5, 1.25]);
              const action = document.querySelector('.action');
              action.classList.add('active');
              action.dataset.pointerId = '998';
            });
            await mobilePage.locator('#settings-open').tap();
            const mobileInputReset = await mobilePage.evaluate(() => ({
              clear: Module.ccall('IsInputStateClear', 'number', [], []),
              activeButtons: document.querySelectorAll('.action.active').length,
              pointerIds: document.querySelectorAll('.action[data-pointer-id]').length,
              musicState: window.TagboundAudio?.getMusicState?.()
            }));
            if (mobileInputReset.clear !== 1 || mobileInputReset.activeButtons || mobileInputReset.pointerIds) {
              throw new Error('Mobile touch/look input was not reset when Settings opened: ' + JSON.stringify(mobileInputReset));
            }
            if (mobileInputReset.musicState !== 'paused') throw new Error('Mobile ambient score did not pause in Settings.');
            const pausedMobileMusicNotes = await mobilePage.evaluate(() => window.TagboundAudio?.getMusicNoteCount?.());
            const mobileSettings = await mobilePage.evaluate(() => ({
              open: !document.querySelector('#settings').classList.contains('hidden'),
              installVisible: document.querySelector('#settings-install').getClientRects().length > 0,
              controlsHidden: document.querySelector('#touch-controls').classList.contains('hidden')
            }));
            if (!mobileSettings.open || !mobileSettings.installVisible || !mobileSettings.controlsHidden) {
              throw new Error('Mobile settings overlay failed: ' + JSON.stringify(mobileSettings));
            }
            await mobilePage.locator('#settings-sound').tap();
            if (await mobilePage.evaluate(() => window.TagboundAudio?.getMusicState?.()) !== 'paused') {
              throw new Error('Mobile ambient score resumed before the Resume action.');
            }
            await mobilePage.locator('#settings-sound').tap();
            await mobilePage.waitForTimeout(550);
            if (await mobilePage.evaluate(() => window.TagboundAudio?.getMusicNoteCount?.()) !== pausedMobileMusicNotes) {
              throw new Error('Mobile ambient score generated notes while Settings was open.');
            }
            await mobilePage.locator('#resume').tap();
            await mobilePage.waitForFunction(
              (previousCount) => window.TagboundAudio?.getMusicState?.() === 'playing' &&
                window.TagboundAudio?.getMusicNoteCount?.() > previousCount,
              pausedMobileMusicNotes,
              { timeout: 5000 }
            );
            if (await mobilePage.locator('#settings-install').evaluate(e => e.getClientRects().length !== 0)) {
              throw new Error('Settings install action remained visible after resume.');
            }
            await mobilePage.locator('[data-bit="4"]').tap();
            await mobilePage.waitForTimeout(1500);
            await mobilePage.screenshot({ path: 'visual-review/mobile-gameplay.png', fullPage: true });
            const mobileGameplayImage = await mobilePage.screenshot({ path: 'visual-review/mobile-gameplay.png', fullPage: true });
            const mobileStaminaRegion = PNG.sync.read(mobileGameplayImage);
            let mobileStaminaDigitPixels = 0;
            let mobileStaminaOverlapGreenPixels = 0;
            for (let y = 56; y < 70; y++) {
              for (let x = 108; x < 127; x++) {
                const pixel = (y * mobileStaminaRegion.width + x) * 4;
                const red = mobileStaminaRegion.data[pixel];
                const green = mobileStaminaRegion.data[pixel + 1];
                const blue = mobileStaminaRegion.data[pixel + 2];
                if (red > 170 && green > 170 && blue > 170) mobileStaminaDigitPixels++;
                if (y >= 60 && y < 67 && green > 100 && green > red + 30 && green > blue + 30) mobileStaminaOverlapGreenPixels++;
              }
            }
            if (mobileStaminaDigitPixels < 5 || mobileStaminaOverlapGreenPixels !== 0) {
              throw new Error('Mobile stamina value is clipped/covered by its bar: ' +
                JSON.stringify({ mobileStaminaDigitPixels, mobileStaminaOverlapGreenPixels }));
            }
            await mobileContext.close();

            const portraitContext = await browser.newContext({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 1,
              isMobile: true,
              hasTouch: true
            });
            const portraitPage = await portraitContext.newPage();
            await portraitPage.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            const portrait = await portraitPage.evaluate(() => ({
              rotateVisible: getComputedStyle(document.querySelector('#rotate')).display !== 'none' &&
                !document.querySelector('#rotate').classList.contains('hidden'),
              message: document.querySelector('#rotate strong')?.textContent
            }));
            if (!portrait.rotateVisible || !portrait.message.includes('ROTATE')) {
              throw new Error('Mobile portrait rotation guidance failed: ' + JSON.stringify(portrait));
            }
            await portraitContext.close();

            console.log('PASS: WebAssembly runtime, WebGL, gameplay start/input/save, service-worker cache, offline reload, mobile landscape controls, and portrait rotation guidance.');
          } finally {
            await browser.close();
          }
          JS

      - uses: actions/upload-artifact@v4
        with:
          name: tagbound-visual-review
          path: visual-review/
          if-no-files-found: error
          retention-days: 1

  publish-dist:
    needs: [build, browser-smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: tagbound-dist
          path: /tmp/tagbound-dist

      - name: Publish tested WebAssembly build to main
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "Skipping stale build; a newer main commit must publish its own tested output."
            exit 0
          fi
          cp -R /tmp/tagbound-dist/. dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "Generated dist is already up to date."
          else
            git commit -m "chore: sync built WebAssembly output"
            git push origin HEAD:main
          fi
