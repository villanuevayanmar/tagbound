            await statPage.locator('#start').click();
            await statPage.waitForFunction(() => document.querySelector('#level-up')?.classList.contains('hidden') === false);
            const beforeChoice = await statPage.evaluate(() => ({
              pending: Module.ccall('GetPendingStatChoices','number',[],[]),
              buttons: [...document.querySelectorAll('[data-stat-choice]')].map(button => ({
                name: button.querySelector('strong')?.textContent,
                disabled: button.disabled
              }))
            }));
            if (beforeChoice.pending !== 1 || beforeChoice.buttons.length !== 5 || beforeChoice.buttons.some(button => button.disabled)) {
              throw new Error('Level-up stat selection did not open with five available choices: ' + JSON.stringify(beforeChoice));
            }
            await statPage.locator('[data-stat-choice="0"]').click();
            await statPage.waitForFunction(() => document.querySelector('#level-up')?.classList.contains('hidden'));
            await statPage.waitForFunction(() => !document.querySelector('#skill-choice')?.classList.contains('hidden'));
            const skillChoices = await statPage.evaluate(() => ({
              pending: Module.ccall('GetPendingSkillChoices','number',[],[]),
              options: [...document.querySelectorAll('.skill-choice')].filter(button => !button.hidden && !button.disabled)
                .map(button => ({ title: button.querySelector('[data-skill-title]')?.textContent, id: button.dataset.skillId }))
            }));
            if (skillChoices.pending !== 1 || skillChoices.options.length !== 2 ||
                !skillChoices.options[0].title?.includes('CLEAVING ARC')) {
              throw new Error('Class skill milestone did not offer unlock choices: ' + JSON.stringify(skillChoices));
            }
            await statPage.locator('#skill-option-0').click();
            await statPage.waitForFunction(() => document.querySelector('#skill-choice')?.classList.contains('hidden'));
            const afterChoice = await statPage.evaluate(() => JSON.parse(localStorage.getItem('tagbound-save') || 'null'));
            if (afterChoice?.schemaVersion !== 3 || afterChoice?.vitality !== 1 ||
                afterChoice?.pendingStatChoices !== 0 || afterChoice?.pendingSkillChoices !== 0 ||
                afterChoice?.skill0 !== 1 || afterChoice?.rank0 !== 1 || afterChoice?.level !== 3) {
              throw new Error('Stat and skill choices did not persist exactly once: ' + JSON.stringify(afterChoice));
            }
            await statPage.locator('#settings-open').click();
            await statPage.locator('#skill-slot-0').click();
            const equippedChoice = await statPage.evaluate(() => ({
              active: JSON.parse(localStorage.getItem('tagbound-save') || 'null')?.activeSkillSlot,
              label: document.querySelector('#skill-slot-0-name')?.textContent
            }));
            if (equippedChoice.active !== 0 || !equippedChoice.label?.includes('CLEAVING ARC')) {
              throw new Error('Settings skill loadout did not retain the equipped technique: ' + JSON.stringify(equippedChoice));
            }
            const equippedAction = await statPage.evaluate(() => {
              const button=document.querySelector('.action.technique');
              return { label:button?.getAttribute('aria-label'), cost:button?.dataset.cost,
                icon:button?.querySelector('svg path')?.getAttribute('d'), disabled:button?.disabled };
            });
            // The Cleaving Arc SVG begins with M4 20, then draws its first blade stroke to 19 5.
            // Match the actual move-to/line-to sequence rather than expecting a second move command.
            if (!equippedAction.label?.includes('CLEAVING ARC') || equippedAction.cost !== '24M' ||
                !equippedAction.icon?.includes('M4 20 19 5') || equippedAction.disabled) {
              throw new Error('Active technique icon/cost/readiness did not match the equipped skill: ' + JSON.stringify(equippedAction));
            }
            await statContext.close();

            // Skirmisher Arrow Rain enters a target-confirm flow and spends Mana only on confirmation.
            const arrowContext = await browser.newContext();
            const arrowPage = await arrowContext.newPage();
            const arrowResponse = await arrowPage.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            if (!arrowResponse?.ok()) throw new Error('Arrow Rain page did not return HTTP 200.');
            await arrowPage.waitForFunction(() => document.querySelector('#loading')?.classList.contains('hidden'), null, { timeout: 45000 });
            const arrowSave = {
              schemaVersion: 2, city: 0, level: 3, xp: 0, unlocked: 0,
              klass: 1, weapon: 3, finished: 0, quest: 0, mana: 90,
              vitality: 0, endurance: 0, focus: 0, power: 0, precision: 0,
              pendingStatChoices: 0
            };
            await arrowPage.evaluate(save => localStorage.setItem('tagbound-save', JSON.stringify(save)), arrowSave);
            await arrowPage.locator('#start').click();
            await arrowPage.waitForFunction(() => !document.querySelector('#skill-choice')?.classList.contains('hidden'));
            await arrowPage.locator('#skill-option-0').click();
            await arrowPage.waitForFunction(() => document.querySelector('#skill-choice')?.classList.contains('hidden'));
            const unlockedArrow = await arrowPage.evaluate(() => JSON.parse(localStorage.getItem('tagbound-save') || 'null'));
            if (unlockedArrow?.skill0 !== 3 || unlockedArrow?.rank0 !== 1 || unlockedArrow?.pendingSkillChoices !== 0) {
              throw new Error('Skirmisher did not unlock Arrow Rain: ' + JSON.stringify(unlockedArrow));
            }
            const arrowAction = await arrowPage.evaluate(() => ({
              label:document.querySelector('.action.technique')?.getAttribute('aria-label'),
              cost:document.querySelector('.action.technique')?.dataset.cost,
              icon:document.querySelector('.action.technique svg path')?.getAttribute('d')
            }));
            if (!arrowAction.label?.includes('ARROW RAIN') || arrowAction.cost !== '38M' ||
                !arrowAction.icon?.includes('M18 3')) {
              throw new Error('Skirmisher technique button did not update to the Arrow Rain icon/cost: ' + JSON.stringify(arrowAction));
            }
            await arrowPage.keyboard.press('q');
            await arrowPage.waitForFunction(() => !document.querySelector('#skill-target')?.classList.contains('hidden'));
            const targetReady = await arrowPage.evaluate(() => ({
              targeting: Module.ccall('IsSkillTargeting','number',[],[]),
              mana: Module.ccall('GetPlayerMana','number',[],[]),
              confirmDisabled: document.querySelector('#skill-target-confirm')?.disabled,
              status: document.querySelector('#skill-target-status')?.textContent
            }));
            if (targetReady.targeting !== 1 || targetReady.mana !== 90 ||
                targetReady.confirmDisabled || targetReady.status !== 'TARGET VALID') {
              throw new Error('Arrow Rain target was not ready without spending Mana: ' + JSON.stringify(targetReady));
            }
            await arrowPage.locator('#skill-target-cancel').click();
            await arrowPage.waitForFunction(() => Module.ccall('IsSkillTargeting','number',[],[]) === 0);
            const arrowCancelled = await arrowPage.evaluate(() => ({
              mana: Module.ccall('GetPlayerMana','number',[],[]),
              effects: Module.ccall('GetSkillEffectCount','number',[],[]),
              saved: JSON.parse(localStorage.getItem('tagbound-save') || 'null')
            }));
            if (arrowCancelled.mana !== 90 || arrowCancelled.effects !== 0 || arrowCancelled.saved?.mana !== 90) {
              throw new Error('Cancelling Arrow Rain spent Mana or created an effect: ' + JSON.stringify(arrowCancelled));
            }
            await arrowPage.keyboard.press('q');
            await arrowPage.waitForFunction(() => !document.querySelector('#skill-target')?.classList.contains('hidden'));
            await arrowPage.locator('#skill-target-confirm').click();
            await arrowPage.waitForFunction(() => Module.ccall('IsSkillTargeting','number',[],[]) === 0);
            const arrowConfirmed = await arrowPage.evaluate(() => ({
              effects: Module.ccall('GetSkillEffectCount','number',[],[]),
              mana: Module.ccall('GetPlayerMana','number',[],[]),
              saved: JSON.parse(localStorage.getItem('tagbound-save') || 'null'),
              cooldown: document.querySelector('.action.technique')?.dataset.cooldown,
              disabled: document.querySelector('.action.technique')?.disabled
            }));
            if (arrowConfirmed.effects !== 1 || arrowConfirmed.mana !== 52 ||
                arrowConfirmed.saved?.mana !== 52 || Number.parseFloat(arrowConfirmed.cooldown) < 7.5 ||
                Number.parseFloat(arrowConfirmed.cooldown) > 8.0 || !arrowConfirmed.disabled) {
              throw new Error('Arrow Rain did not create its effect and spend/save Mana on confirmation: ' + JSON.stringify(arrowConfirmed));
            }
            await arrowContext.close();

            // One floor-navigation key press advances only to the next discovered floor.
            const floorContext = await browser.newContext();
            const floorPage = await floorContext.newPage();
            await floorPage.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await floorPage.waitForFunction(() => document.querySelector('#loading')?.classList.contains('hidden'), null, { timeout: 45000 });
            const floorSave = {
              schemaVersion: 2, city: 0, level: 1, xp: 0, unlocked: 0,
              klass: 0, weapon: 0, finished: 0, quest: 0, mana: 70,
              vitality: 0, endurance: 0, focus: 0, power: 0, precision: 0,
              pendingStatChoices: 0
            };
            const floorDiscovery = Array(1600).fill('0');
            floorDiscovery[150]='1';
            floorDiscovery[470]='1';
            floorDiscovery[1110]='1';
            await floorPage.evaluate(({save,map}) => {
              localStorage.setItem('tagbound-save',JSON.stringify(save));
              localStorage.setItem('tagbound-exploration-v2-0',map.join(''));
            },{save:floorSave,map:floorDiscovery});
            await floorPage.locator('#start').click();
            await floorPage.waitForFunction(() => document.querySelector('#intro')?.classList.contains('hidden'));
            await floorPage.keyboard.press('m');
            await floorPage.waitForFunction(() => Module.ccall('IsMapOpen','number',[],[])===1);
            await floorPage.keyboard.press(']');
            await floorPage.waitForFunction(() => Module.ccall('GetMapFloor','number',[],[])===1);
            const oneStep = await floorPage.evaluate(() => ({
              floor:Module.ccall('GetMapFloor','number',[],[]),
              label:document.querySelector('#map-floor-label')?.textContent
            }));
            if(oneStep.floor!==1||oneStep.label!=='ROOFTOP 1') {
              throw new Error('A single floor key press skipped more than one discovered floor: '+JSON.stringify(oneStep));
            }
            await floorContext.close();
            const mobileSettingsButtonClear = await mobilePage.evaluate(() => {
              const s = document.querySelector('#settings-open').getBoundingClientRect();
              const h = innerHeight <= 440 ? 116 : innerHeight - 78;
              const boxes = [
                { left: 12, right: 282, top: 12, bottom: 110 },
                { left: innerWidth - 245, right: innerWidth - 12, top: 12, bottom: 88 },
                { left: innerWidth / 2 - 56, right: innerWidth / 2 + 56, top: 12, bottom: 64 },
                { left: innerWidth / 2 - 96, right: innerWidth / 2 + 96, top: 67, bottom: 90 },
                { left: 12, right: 402, top: h, bottom: h + 65 }
              ];
              return boxes.every(b => !(s.left < b.right && s.right > b.left && s.top < b.bottom && s.bottom > b.top));
            });
            if (!mobileSettingsButtonClear) throw new Error('Mobile Settings button overlaps a HUD panel.');
            const installHiddenDuringGameplay = await mobilePage.locator('#install').evaluate(e => e.getClientRects().length === 0);
            if (!installHiddenDuringGameplay) throw new Error('PWA install action remained visible during mobile gameplay.');
            await mobilePage.evaluate(() => {
              Module.ccall('SetTouch', null, ['number', 'number', 'number'], [-0.4, 0.75, 8]);
              Module.ccall('SetLook', null, ['number', 'number'], [4.5, 1.25]);
              const action = document.querySelector('.action');
              action.classList.add('active');
              action.dataset.pointerId = '998';
            });
            await mobilePage.locator('#settings-open').tap();
            const mobileInputReset = await mobilePage.evaluate(() => ({
              clear: Module.ccall('IsInputStateClear', 'number', [], []),
              activeButtons: document.querySelectorAll('.action.active').length,
              pointerIds: document.querySelectorAll('.action[data-pointer-id]').length,
              musicState: window.TagboundAudio?.getMusicState?.()
            }));
            if (mobileInputReset.clear !== 1 || mobileInputReset.activeButtons || mobileInputReset.pointerIds) {
              throw new Error('Mobile touch/look input was not reset when Settings opened: ' + JSON.stringify(mobileInputReset));
            }
            if (mobileInputReset.musicState !== 'paused') throw new Error('Mobile ambient score did not pause in Settings.');
            const pausedMobileMusicNotes = await mobilePage.evaluate(() => window.TagboundAudio?.getMusicNoteCount?.());
            const mobileSettings = await mobilePage.evaluate(() => ({
              open: !document.querySelector('#settings').classList.contains('hidden'),
              installVisible: document.querySelector('#settings-install').getClientRects().length > 0,
              controlsHidden: document.querySelector('#touch-controls').classList.contains('hidden')
            }));
            if (!mobileSettings.open || !mobileSettings.installVisible || !mobileSettings.controlsHidden) {
              throw new Error('Mobile settings overlay failed: ' + JSON.stringify(mobileSettings));
            }
            await mobilePage.locator('#settings-sound').tap();
            if (await mobilePage.evaluate(() => window.TagboundAudio?.getMusicState?.()) !== 'paused') {
              throw new Error('Mobile ambient score resumed before the Resume action.');
            }
            await mobilePage.locator('#settings-sound').tap();
            await mobilePage.waitForTimeout(550);
            if (await mobilePage.evaluate(() => window.TagboundAudio?.getMusicNoteCount?.()) !== pausedMobileMusicNotes) {
              throw new Error('Mobile ambient score generated notes while Settings was open.');
            }
            await mobilePage.locator('#resume').tap();
            await mobilePage.waitForFunction(
              (previousCount) => window.TagboundAudio?.getMusicState?.() === 'playing' &&
                window.TagboundAudio?.getMusicNoteCount?.() > previousCount,
              pausedMobileMusicNotes,
              { timeout: 5000 }
            );
            if (await mobilePage.locator('#settings-install').evaluate(e => e.getClientRects().length !== 0)) {
              throw new Error('Settings install action remained visible after resume.');
            }
            await mobilePage.locator('[data-bit="4"]').tap();
            await mobilePage.waitForTimeout(1500);
            await assertCanvasFramesVisible(mobilePage, 'Mobile-landscape gameplay');
            await mobilePage.screenshot({ path: 'visual-review/mobile-gameplay.png', fullPage: true });
            const mobileGameplayImage = await mobilePage.screenshot({ path: 'visual-review/mobile-gameplay.png', fullPage: true });
            const mobileStaminaRegion = PNG.sync.read(mobileGameplayImage);
            let mobileStaminaDigitPixels = 0;
            let mobileStaminaOverlapGreenPixels = 0;
            // The C++ HUD draws STAMINA at x=24, y=39 on both desktop and mobile.
            // Sample the same digit band as the desktop assertion, not the lower MANA row.
            for (let y = 37; y < 54; y++) {
              for (let x = 70; x < 126; x++) {
                const pixel = (y * mobileStaminaRegion.width + x) * 4;
                const red = mobileStaminaRegion.data[pixel];
                const green = mobileStaminaRegion.data[pixel + 1];
                const blue = mobileStaminaRegion.data[pixel + 2];
                if (red > 170 && green > 170 && blue > 170) mobileStaminaDigitPixels++;
                if (y >= 43 && y < 51 && green > 100 && green > red + 30 && green > blue + 30) mobileStaminaOverlapGreenPixels++;
              }
            }
            if (mobileStaminaDigitPixels < 5 || mobileStaminaOverlapGreenPixels !== 0) {
              throw new Error('Mobile stamina value is clipped/covered by its bar: ' +
                JSON.stringify({ mobileStaminaDigitPixels, mobileStaminaOverlapGreenPixels }));
            }
            await mobileContext.close();

            const portraitContext = await browser.newContext({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 1,
              isMobile: true,
              hasTouch: true
            });
            const portraitPage = await portraitContext.newPage();
            await portraitPage.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            const portrait = await portraitPage.evaluate(() => ({
              rotateVisible: getComputedStyle(document.querySelector('#rotate')).display !== 'none' &&
                !document.querySelector('#rotate').classList.contains('hidden'),
              message: document.querySelector('#rotate strong')?.textContent
            }));
            if (!portrait.rotateVisible || !portrait.message.includes('ROTATE')) {
              throw new Error('Mobile portrait rotation guidance failed: ' + JSON.stringify(portrait));
            }
            await portraitContext.close();

            // Force a real WebGL context loss in an isolated session and verify recovery reloads raylib.
            const recoveryContext = await browser.newContext({
              viewport: { width: 844, height: 390 },
              deviceScaleFactor: 1
            });
            const recoveryPage = await recoveryContext.newPage();
            await recoveryPage.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await recoveryPage.waitForFunction(
              () => document.querySelector('#loading')?.classList.contains('hidden'),
              null,
              { timeout: 45000 }
            );
            await recoveryPage.locator('#start').click();
            await recoveryPage.waitForFunction(() => document.querySelector('#intro')?.classList.contains('hidden'));
            // Corrupt only the test fixture after gameplay has started. SaveNow must replace it
            // with the actual in-memory city before the page reloads.
            await recoveryPage.evaluate(() => {
              const save = JSON.parse(localStorage.getItem('tagbound-save') || '{}');
              save.city = 4;
              save.unlocked = 4;
              localStorage.setItem('tagbound-save', JSON.stringify(save));
            });
            const recoveryNavigation = recoveryPage.waitForNavigation({
              waitUntil: 'domcontentloaded',
              timeout: 15000
            });
            await recoveryPage.evaluate(() => {
              const canvas = document.querySelector('#canvas');
              const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
              const extension = gl?.getExtension('WEBGL_lose_context');
              if (!extension) throw new Error('Chromium WEBGL_lose_context extension is unavailable.');
              canvas.addEventListener('webglcontextlost', () => {
                setTimeout(() => extension.restoreContext(), 200);
              }, { once: true });
              extension.loseContext();
            });
            await recoveryNavigation;
            await recoveryPage.waitForFunction(
              () => document.querySelector('#loading')?.classList.contains('hidden'),
              null,
              { timeout: 45000 }
            );
            const recoveryState = await recoveryPage.evaluate(() => ({
              attempted: !!sessionStorage.getItem('tagbound-webgl-recovery-at'),
              save: JSON.parse(localStorage.getItem('tagbound-save') || 'null')
            }));
            if (!recoveryState.attempted || recoveryState.save?.city !== 0 ||
                recoveryState.save?.unlocked !== 0 || recoveryState.save?.schemaVersion !== 3) {
              throw new Error('WebGL context recovery did not flush the in-memory save before reloading: ' +
                JSON.stringify(recoveryState));
            }
            await recoveryPage.locator('#start').click();
            await recoveryPage.waitForFunction(
              () => document.querySelector('#intro')?.classList.contains('hidden') &&
                Module.ccall('IsGameUpdating', 'number', [], []) === 1,
              null,
              { timeout: 10000 }
            );
            await recoveryContext.close();

            console.log('PASS: WebAssembly runtime, WebGL, context-loss recovery, gameplay start/input/save, service-worker cache, offline reload, mobile landscape controls, and portrait rotation guidance.');
          } finally {
            await browser.close();
          }
          JS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tagbound-visual-review
          path: visual-review/
          if-no-files-found: warn
          retention-days: 1

  publish-dist:
    needs: [build, browser-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: tagbound-dist
          path: /tmp/tagbound-dist

      - name: Publish tested WebAssembly build to main
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "Skipping stale build; a newer main commit must publish its own tested output."
            exit 0
          fi
          cp -R /tmp/tagbound-dist/. dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "Generated dist is already up to date."
          else
            git commit -m "chore: sync built WebAssembly output"
            git push origin HEAD:main
          fi
